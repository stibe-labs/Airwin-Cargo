<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>News & Updates | Airwin Logistics</title>
  <meta content="News & Updates | Airwin Logistics" property="og:title"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
  <link rel="stylesheet" href="/css/united-carriers.min.css"/>
  <style>
    /* Reset & Base */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff !important;
      color: #111111 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* Common Airwin Header on White Background */
    .header,
    #airwin-main-header {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      width: 100% !important;
      z-index: 1000 !important;
      background: rgba(255, 255, 255, 0.95) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08) !important;
      transition: transform 0.35s ease, background 0.3s ease !important;
    }
    .header-inner {
      width: 100% !important;
      max-width: 1600px !important;
      margin: 0 auto !important;
      padding: 1.4rem 4rem !important;
      box-sizing: border-box !important;
    }
    .header-row-nav {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      width: 100% !important;
    }
    .header-logo-link {
      display: flex !important;
      align-items: center !important;
      text-decoration: none !important;
    }
    .header-brand-logo {
      height: 3.4rem !important;
      width: auto !important;
      object-fit: contain !important;
    }
    .header-nav-links {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 3.2rem !important;
    }
    .nav-link-item {
      font-size: 1.35rem !important;
      font-weight: 500 !important;
      color: #333333 !important;
      text-decoration: none !important;
      letter-spacing: -0.01em !important;
      transition: color 0.2s ease !important;
      padding: 0.4rem 0 !important;
      position: relative !important;
    }
    .nav-link-item:hover {
      color: #00B2FE !important;
    }
    .nav-link-item.active {
      color: #00B2FE !important;
      font-weight: 600 !important;
    }
    .nav-link-item.active::after {
      content: '' !important;
      position: absolute !important;
      bottom: -2px !important;
      left: 0 !important;
      width: 100% !important;
      height: 2px !important;
      background: #00B2FE !important;
      border-radius: 2px !important;
    }
    .header-tracking-btn {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 0.85rem 2.2rem !important;
      border-radius: 9999px !important;
      background-color: #00B2FE !important;
      color: #ffffff !important;
      font-size: 1.25rem !important;
      font-weight: 600 !important;
      text-decoration: none !important;
      box-shadow: 0 4px 14px rgba(0, 178, 254, 0.25) !important;
      transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease !important;
    }
    .header-tracking-btn:hover {
      background-color: #0099e0 !important;
      transform: translateY(-1px) !important;
      box-shadow: 0 6px 20px rgba(0, 178, 254, 0.35) !important;
    }

    /* Main Container for Blank White Screen */
    .unavailable-viewport {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      padding: 8rem 2rem 4rem 2rem;
      box-sizing: border-box;
      text-align: center;
    }

    .unavailable-card {
      max-width: 620px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .unavailable-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.5rem 1.4rem;
      border-radius: 9999px;
      background-color: #f4f4f4;
      border: 1px solid #e5e5e5;
      color: #666666;
      font-size: 1.2rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 2.4rem;
    }

    .unavailable-badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ff9900;
      box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.2);
    }

    .unavailable-heading {
      font-size: clamp(2.8rem, 4vw, 4.2rem);
      font-weight: 800;
      color: #111111;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin: 0 0 1.6rem 0;
      text-transform: uppercase;
    }

    .unavailable-desc {
      font-size: clamp(1.4rem, 1.8vw, 1.7rem);
      color: #666666;
      line-height: 1.6;
      margin: 0 0 3.2rem 0;
      max-width: 480px;
    }

    .unavailable-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      padding: 1.2rem 3rem;
      border-radius: 9999px;
      background-color: #111111;
      color: #ffffff;
      font-size: 1.35rem;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }
    .unavailable-btn:hover {
      background-color: #00B2FE;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 178, 254, 0.3);
    }

    @media (max-width: 991px) {
      .header-inner {
        padding: 1.2rem 2rem !important;
      }
      .header-nav-links {
        gap: 1.8rem !important;
      }
      .nav-link-item {
        font-size: 1.2rem !important;
      }
    }

    @media (max-width: 767px) {
      .header-nav-links {
        display: none !important;
      }
      .header-inner {
        padding: 1rem 1.6rem !important;
      }
      .header-brand-logo {
        height: 2.8rem !important;
      }
    }
  </style>
</head>
<body class="body" data-barba="wrapper">

  <!-- Airwin Navigation Header -->
  <header class="header nav-visible" id="airwin-main-header">
    <div class="header-inner">
      <div class="header-row-nav">
        <a href="/index.html" class="header-logo-link" title="Airwin Logistics">
          <img src="/airwin_logo.png" alt="Airwin Logistics" class="header-brand-logo" />
        </a>
        <nav class="header-nav-links" aria-label="Main Navigation">
          <a href="/index.html" class="nav-link-item ">Home</a>
          <a href="/about.html" class="nav-link-item ">About</a>
          <a href="/services.html" class="nav-link-item ">Services</a>
          <a href="/insights.html" class="nav-link-item active">News &amp; Updates</a>
          <a href="/careers.html" class="nav-link-item ">Career</a>
          <a href="/contact.html" class="nav-link-item ">Contact</a>
        </nav>
        <div class="header-nav-actions">
          <a href="/tracking.html" class="header-tracking-btn">
            <span>Tracking</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Barba Container for Smooth Page Transitions -->
  <main class="main" data-barba="container" data-barba-namespace="article">
    <div class="unavailable-viewport">
      <div class="unavailable-card">
        <div class="unavailable-badge">
          <span class="unavailable-badge-dot"></span>
          <span>Notice</span>
        </div>
        <h1 class="unavailable-heading">Temporarily Unavailable</h1>
        <p class="unavailable-desc">
          This page is temporarily unavailable. We are currently performing maintenance and updates.
        </p>
        <a href="/index.html" class="unavailable-btn">
          <span>Back to Home</span>
        </a>
      </div>
    </div>
  </main>

</body>
</html>
